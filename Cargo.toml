[package]
name = "mazelab"
version = "0.1.0"
edition = "2024"
rust-version = "1.88.0"
resolver = "3"

[dependencies]
ratatui  = "0.30.2"
rand     = "0.10.2"
rand_pcg = "0.10.2"
clap     = { version = "4.6", features = ["derive"] }

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "warn"
expect_used = "warn"

# Allowed, with the reason:
# doc_markdown: "MazeLab" is the product name, not an identifier. The lint asks
# for backticks around it in every doc comment, which would make the prose read
# as code.
doc_markdown = "allow"
